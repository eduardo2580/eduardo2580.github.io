  <style>
    /* ---- Page-specific layout (shares brand tokens from style.css) ---- */
    body.privacy-page {
      display: block;
      background-color: var(--parchment);
    }
    .privacy-page-wrap {
      max-width: 760px;
      margin: 0 auto;
      padding: calc(1.6rem + var(--safe-top)) 1.4rem calc(4rem + var(--safe-bottom)) 1.4rem;
    }
    .pp-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
      margin-bottom: 2rem;
    }
    .pp-back {
      display: inline-flex;
      align-items: center;
      gap: .4rem;
      font-family: 'Cinzel', serif;
      font-size: .85rem;
      font-weight: 700;
      color: var(--gold-dark);
      text-decoration: none;
      border: 1.5px solid var(--gold-dark);
      border-radius: 8px;
      padding: .5rem .9rem;
      transition: all .2s;
    }
    .pp-back:hover { background: var(--gold-dark); color: #fff; }

    .pp-lang-switch {
      display: flex;
      gap: .4rem;
      background: var(--white-alpha);
      border: 1.5px solid var(--gold-dark);
      border-radius: 10px;
      padding: .25rem;
    }
    .pp-lang-switch button {
      font-family: 'Cinzel', serif;
      font-size: .75rem;
      font-weight: 700;
      background: transparent;
      border: none;
      color: var(--ink-soft);
      padding: .35rem .6rem;
      border-radius: 7px;
      cursor: pointer;
    }
    .pp-lang-switch button.active { background: var(--gold-dark); color: #fff; }

    .pp-hero { text-align: center; margin-bottom: 1.6rem; }
    .pp-hero i { font-size: 2.4rem; color: var(--gold-dark); }
    .pp-hero h1 {
      font-family: 'Cinzel', serif;
      color: var(--red-bible);
      font-size: clamp(1.6rem, 1.3rem + 1vw, 2.1rem);
      margin: .6rem 0 .5rem 0;
      letter-spacing: .02em;
    }
    .pp-hero p.lead {
      color: var(--ink-soft);
      font-size: 1.05rem;
      max-width: 560px;
      margin: 0 auto;
      line-height: 1.6;
    }

    .pp-badges {
      display: flex;
      flex-wrap: wrap;
      gap: .5rem;
      justify-content: center;
      margin: 1.4rem 0 2rem 0;
    }
    .pp-badge {
      font-family: 'Cinzel', serif;
      font-size: .68rem;
      font-weight: 700;
      color: var(--gold-dark);
      background: rgba(201,169,110,0.15);
      border: 1px solid rgba(201,169,110,0.4);
      border-radius: 20px;
      padding: .4rem .8rem;
    }

    .pp-updated {
      text-align: center;
      font-size: .8rem;
      opacity: .55;
      margin-bottom: 2rem;
    }

    .pp-article {
      background: var(--white-alpha);
      border: 1.5px solid rgba(201,169,110,0.35);
      border-radius: 16px;
      padding: clamp(1.4rem, 1rem + 1.5vw, 2.4rem);
    }
    .pp-article section { margin-bottom: 2rem; }
    .pp-article section:last-child { margin-bottom: 0; }
    .pp-article h2 {
      font-family: 'Cinzel', serif;
      color: var(--red-bible);
      font-size: 1.15rem;
      margin-bottom: .7rem;
      display: flex;
      align-items: center;
      gap: .5rem;
    }
    .pp-article h2 i { color: var(--gold-dark); font-size: 1.1rem; }
    .pp-article p, .pp-article li {
      color: var(--ink-soft);
      line-height: 1.7;
      font-size: 1rem;
    }
    .pp-article ul { padding-left: 1.3rem; margin: .5rem 0; }
    .pp-article li { margin-bottom: .4rem; }
    .pp-article strong { color: var(--ink); }
    .pp-tldr {
      background: rgba(201,169,110,0.12);
      border-left: 3px solid var(--gold);
      border-radius: 8px;
      padding: 1rem 1.2rem;
      margin-bottom: 2rem;
    }
    .pp-tldr strong { font-family: 'Cinzel', serif; color: var(--red-bible); font-size: .8rem; letter-spacing: .05em; }

    .pp-cta-row {
      display: flex;
      flex-wrap: wrap;
      gap: .8rem;
      margin-top: 1.2rem;
    }
    .pp-cta {
      display: inline-flex;
      align-items: center;
      gap: .5rem;
      font-family: 'Cinzel', serif;
      font-size: .8rem;
      font-weight: 700;
      color: #fff;
      background: var(--gold-dark);
      border-radius: 10px;
      padding: .7rem 1rem;
      text-decoration: none;
      transition: background .2s;
    }
    .pp-cta:hover { background: var(--gold); }

    .pp-footer {
      text-align: center;
      margin-top: 2.5rem;
      font-size: .85rem;
      opacity: .6;
    }
    .pp-footer a { color: var(--gold-dark); }

    @media (max-width: 480px) {
      .pp-header { justify-content: center; }
    }
  </style>
</head>

    function applyPPLang(lang) {
      const dict = PP_TRANSLATIONS[lang] || PP_TRANSLATIONS.pt;
      document.querySelectorAll('[data-t]').forEach(el => {
        const key = el.getAttribute('data-t');
        if (dict[key] !== undefined) el.innerHTML = dict[key];
      });
      document.documentElement.lang = lang === 'pt' ? 'pt-BR' : lang;
      document.title = ({
        pt: 'Privacidade — Bíblia Sagrada',
        en: 'Privacy — Holy Bible',
        es: 'Privacidad — Biblia Sagrada'
      })[lang] || document.title;
      document.querySelectorAll('#pp-lang-switch button').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.lang === lang);
      });
      try { localStorage.setItem('pp_lang', lang); } catch (_) {}
    }

    function detectInitialLang() {
      try {
        const saved = localStorage.getItem('pp_lang');
        if (saved && PP_TRANSLATIONS[saved]) return saved;
        const cfg = JSON.parse(localStorage.getItem('bible_config') || '{}');
        if (cfg.lang && PP_TRANSLATIONS[cfg.lang]) return cfg.lang;
      } catch (_) {}
      const nav = (navigator.language || 'pt').slice(0, 2).toLowerCase();
      return PP_TRANSLATIONS[nav] ? nav : 'pt';
    }

    document.querySelectorAll('#pp-lang-switch button').forEach(btn => {
      btn.addEventListener('click', () => applyPPLang(btn.dataset.lang));
    });

    applyPPLang(detectInitialLang());
  </script>
